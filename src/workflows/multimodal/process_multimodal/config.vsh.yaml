name: process_multimodal
namespace: workflows/multimodal
description: |
  Process a raw multimodal dataset into a common multimodal dataset. Each modality is
  normalised in the way that suits it (gene expression to log CP10k, surface proteins with
  CLR, chromatin accessibility with TF-IDF), gets a truncated SVD embedding and a selection
  of highly variable features.
argument_groups:
  - name: Inputs
    arguments:
      - name: --input
        __merge__: /src/api/file_multimodal_raw.yaml
        direction: input
        required: true
  - name: Outputs
    arguments:
      - name: --output_dataset
        __merge__: /src/api/file_multimodal_dataset.yaml
        direction: output
        required: true
resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
dependencies:
  - name: utils/split_mudata
  - name: utils/combine_mudata
  - name: normalization/log_cp
  - name: normalization/prot_clr
  - name: normalization/atac_tfidf
  - name: processors/svd
  - name: processors/hvg
  - name: validation/validate_dataset
runners:
  - type: nextflow
