name: load_openproblems_op3
namespace: workflows/scrnaseq
description: |
  Fetch the Open Problems Perturbation Prediction (OP3) dataset and store it as a raw dataset.
argument_groups:
  - name: Input options
    description: "Options for selecting input data"
    arguments:
      - name: --input
        type: file
        description: "Link to initial input dataset"
        required: false
        default: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE279nnn/GSE279945/suppl/GSE279945_sc_counts_processed.h5ad
        example: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE279nnn/GSE279945/suppl/GSE279945_sc_counts_processed.h5ad
      - name: --data_type
        type: string
        description: "Data type to load"
        default: sc
        choices: [sc]
      - name: --donor_id
        type: string
        description: "Filter to a specific donor"
        required: false
      - name: --cell_type
        type: string
        description: "Filter to a specific cell type"
        required: false
      - name: --perturbation
        type: string
        description: "Filter to a specific perturbation"
        required: false
  - name: Dataset metadata
    description: "Information about the dataset that will be stored in the `.uns` slot."
    arguments:
      - name: --id
        type: string
        description: "Unique identifier."
        required: true
        default: openproblems_op3
      - name: --dataset_name
        type: string
        description: "Nicely formatted name."
        required: true
        default: "OP3: single-cell multimodal dataset in PBMCs for perturbation prediction benchmarking"
      - name: --dataset_url
        type: string
        description: "Link to the original source of the dataset."
        required: false
        default: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE279nnn/GSE279945/suppl/GSE279945_sc_counts_processed.h5ad
      - name: --dataset_reference
        type: string
        multiple: true
        description: "Bibtex reference of the paper in which the dataset was published."
        required: false
        default: GSE279945
      - name: --dataset_summary
        type: string
        description: "Short description of the dataset."
        required: true
        default: "The Open Problems Perturbation Prediction (OP3) dataset with small molecule perturbations in PBMCs"
      - name: --dataset_description
        type: string
        description: "Long description of the dataset."
        required: true
        default: "The OP3 dataset is to-date the largest single-cell small molecule perturbation 
          dataset in primary tissue with multiple donor replicates."
  - __merge__: /src/workflows/scrnaseq/arguments_subsample.yaml
  - name: Outputs
    arguments:
      - name: --output_raw
        __merge__: /src/api/file_raw.yaml
        direction: output
        required: true
resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
dependencies:
  - name: loaders/scrnaseq/openproblems_op3
  - name: processors/subsample
  - name: validation/validate_dataset
runners:
  - type: nextflow
