name: load_openproblems_neurips2021_bmmc
namespace: workflows/multimodal
description: |
  Fetch a NeurIPS 2021 bone marrow dataset (CITE-seq or Multiome) and store it as a raw
  multimodal dataset.
argument_groups:
  - name: Inputs
    arguments:
      - name: --input
        type: file
        description: "Gzipped processed h5ad file published at https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE194122."
        required: true
        example: GSE194122_openproblems_neurips2021_cite_BMMC_processed.h5ad.gz
      - name: --mod1
        type: string
        description: "Feature type of the gene expression features in the source."
        required: true
        example: GEX
      - name: --mod2
        type: string
        description: "Feature type of the other modality in the source."
        required: true
        choices: [ADT, ATAC]
        example: ADT
  - name: Dataset metadata
    description: "Information about the dataset that will be stored in the global `.uns` slot."
    arguments:
      - name: --id
        type: string
        description: "Unique identifier of the dataset."
        required: true
      - name: --dataset_name
        type: string
        description: "Nicely formatted name."
        required: true
      - name: --dataset_url
        type: string
        description: "Link to the original source of the dataset."
        required: false
      - name: --dataset_reference
        type: string
        multiple: true
        description: "Bibtex reference of the paper in which the dataset was published."
        required: false
      - name: --dataset_summary
        type: string
        description: "Short description of the dataset."
        required: true
      - name: --dataset_description
        type: string
        description: "Long description of the dataset."
        required: true
  - __merge__: /src/workflows/scrnaseq/arguments_subsample.yaml
  - name: Outputs
    arguments:
      - name: --output_raw
        __merge__: /src/api/file_multimodal_raw.yaml
        direction: output
        required: true
resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf
dependencies:
  - name: loaders/multimodal/openproblems_neurips2021_bmmc
  - name: processors/subsample
  - name: validation/validate_dataset
  - name: utils/decompress_gzip
    repository: openproblems
runners:
  - type: nextflow
