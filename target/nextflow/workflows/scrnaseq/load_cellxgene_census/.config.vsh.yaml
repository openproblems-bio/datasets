name: "load_cellxgene_census"
namespace: "workflows/scrnaseq"
version: "build_main"
argument_groups:
- name: "Input database"
  description: "Open CellxGene Census by version or URI."
  arguments:
  - type: "string"
    name: "--input_uri"
    description: "If specified, a URI containing the Census SOMA objects. If specified,\
      \ will take precedence over the `--census_version` argument."
    info: null
    example:
    - "s3://bucket/path"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--census_version"
    description: "The date of the CELLxGENE Census release to use (e.g. \"2023-07-25\"\
      ). `latest`\nand `stable` are not allowed, so that the same parameters always\
      \ give the same\ndataset. For more information, check the documentation on [Census\
      \ data\nreleases](https://chanzuckerberg.github.io/cellxgene-census/cellxgene_census_docsite_data_release_info.html).\n"
    info: null
    example:
    - "2023-07-25"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Cell query"
  description: "Arguments related to the query."
  arguments:
  - type: "string"
    name: "--species"
    description: "The organism to query, one of `homo_sapiens` or `mus_musculus`."
    info: null
    default:
    - "homo_sapiens"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obs_value_filter"
    description: "Filter for selecting the `obs` metadata (i.e. cells). Value is a\
      \ filter query written in the SOMA `value_filter` syntax."
    info: null
    example:
    - "is_primary_data == True and cell_type_ontology_term_id in ['CL:0000136', 'CL:1000311',\
      \ 'CL:0002616'] and suspension_type == 'cell'"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Cell filter"
  description: "Filter the cells based on a minimum cell count per specified group"
  arguments:
  - type: "string"
    name: "--cell_filter_grouping"
    description: "A subset of 'obs' columns by which to group the cells for filtering.\n\
      Only groups surpassing or equal to the `--cell_filter_minimum_count`\nthreshold\
      \ will be retained. Take care not to introduce a selection\nbias against cells\
      \ with more fine-grained ontology annotations.\n"
    info: null
    example:
    - "dataset_id"
    - "tissue"
    - "assay"
    - "disease"
    - "cell_type"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "double"
    name: "--cell_filter_minimum_count"
    description: "A minimum number of cells per group to retain. If `--cell_filter_grouping`\n\
      is defined, this parameter should also be provided and vice versa.\n"
    info: null
    example:
    - 100.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Cell metadata"
  description: "Cell metadata arguments"
  arguments:
  - type: "string"
    name: "--obs_batch"
    description: "Location of where to find the observation batch IDs.  \n\n* If not\
      \ specified, the `.obs[\"batch\"]` field will not be included.\n* If one or\
      \ more values are specified, the `.obs[\"batch\"]` field will be \n  set to\
      \ the concatenated values of the specified fields, separated by\n  the `obs_batch_separator`.\n"
    info: null
    example:
    - "batch"
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--obs_batch_separator"
    description: "Separator to use when concatenating the values of the `--obs_batch`\
      \ fields."
    info: null
    default:
    - "+"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Dataset metadata"
  description: "Information about the dataset that will be stored in the `.uns` slot."
  arguments:
  - type: "string"
    name: "--id"
    description: "Nicely formatted name."
    info: null
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--dataset_name"
    description: "Nicely formatted name."
    info: null
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--dataset_url"
    description: "Link to the original source of the dataset."
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--dataset_reference"
    description: "Bibtex reference of the paper in which the dataset was published."
    info: null
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--dataset_summary"
    description: "Short description of the dataset."
    info: null
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--dataset_description"
    description: "Long description of the dataset."
    info: null
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Sampling options"
  description: "Subsample the dataset, e.g. to create test resources."
  arguments:
  - type: "boolean"
    name: "--do_subsample"
    description: "Whether or not to subsample the dataset."
    info: null
    default:
    - false
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_obs"
    description: "Maximum number of observations to be kept. It might end up being\
      \ less because empty cells / genes are removed."
    info: null
    default:
    - 500
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_vars"
    description: "Maximum number of variables to be kept. It might end up being less\
      \ because empty cells / genes are removed."
    info: null
    default:
    - 500
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--keep_features"
    description: "A list of genes to keep."
    info: null
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--keep_cell_type_categories"
    description: "Cell types to keep."
    info: null
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "string"
    name: "--keep_batch_categories"
    description: "Batches to keep."
    info: null
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ";"
  - type: "boolean_true"
    name: "--even"
    description: "Subsample evenly from different batches."
    info: null
    direction: "input"
  - type: "integer"
    name: "--seed"
    description: "A seed for the subsampling."
    info: null
    default:
    - 0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output_raw"
    label: "Raw dataset"
    summary: "An unprocessed dataset as output by a dataset loader."
    description: "This dataset contains raw counts and metadata as output by a dataset\
      \ loader.\n\nCell metadata is annotated with ontology term ids, as in CELLxGENE:\
      \ these are required for the assay, cell type, developmental stage, disease,\
      \ organism, self-reported ethnicity, sex and tissue. The organism is annotated\
      \ per cell, so a dataset can contain cells from several organisms.\n\nThe format\
      \ of this file is derived from the [CELLxGENE schema v4.0.0](https://github.com/chanzuckerberg/single-cell-curation/blob/main/schema/4.0.0/schema.md).\n"
    info:
      format:
        type: "anndata_zarr"
        layers:
        - type: "integer"
          name: "counts"
          description: "Raw counts"
          required: true
        obs:
        - type: "string"
          name: "dataset_id"
          description: "Identifier for the dataset from which the cell data is derived,\
            \ useful for tracking and referencing purposes."
          required: false
        - type: "string"
          name: "assay"
          description: "Type of assay used to generate the cell data, indicating the\
            \ methodology or technique employed."
          required: false
        - type: "string"
          name: "assay_ontology_term_id"
          description: "Experimental Factor Ontology (`EFO:`) term identifier for\
            \ the assay, providing a standardized reference to the assay type."
          required: true
        - type: "string"
          name: "cell_type"
          description: "Classification of the cell type based on its characteristics\
            \ and function within the tissue or organism."
          required: false
        - type: "string"
          name: "cell_type_ontology_term_id"
          description: "Cell Ontology (`CL:`) term identifier for the cell type, offering\
            \ a standardized reference to the specific cell classification."
          required: true
        - type: "string"
          name: "development_stage"
          description: "Stage of development of the organism or tissue from which\
            \ the cell is derived, indicating its maturity or developmental phase."
          required: false
        - type: "string"
          name: "development_stage_ontology_term_id"
          description: "Ontology term identifier for the developmental stage, providing\
            \ a standardized reference to the organism's developmental phase.\n\n\
            If the organism is human (`organism_ontology_term_id == 'NCBITaxon:9606'`),\
            \ then the Human Developmental Stages (`HsapDv:`) ontology is used.  \n\
            If the organism is mouse (`organism_ontology_term_id == 'NCBITaxon:10090'`),\
            \ then the Mouse Developmental Stages (`MmusDv:`) ontology is used.\n\
            Otherwise, the Uberon (`UBERON:`) ontology is used.\n"
          required: true
        - type: "string"
          name: "disease"
          description: "Information on any disease or pathological condition associated\
            \ with the cell or donor."
          required: false
        - type: "string"
          name: "disease_ontology_term_id"
          description: "Ontology term identifier for the disease, enabling standardized\
            \ disease classification and referencing.\n\nMust be a term from the Mondo\
            \ Disease Ontology (`MONDO:`) ontology term, or `PATO:0000461` from the\
            \ Phenotype And Trait Ontology (`PATO:`).\n"
          required: true
        - type: "string"
          name: "donor_id"
          description: "Identifier for the donor from whom the cell sample is obtained."
          required: false
        - type: "boolean"
          name: "is_primary_data"
          description: "Indicates whether the data is primary (directly obtained from\
            \ experiments) or has been computationally derived from other primary\
            \ data."
          required: false
        - type: "string"
          name: "organism"
          description: "Organism from which the cell sample is obtained."
          required: false
        - type: "string"
          name: "organism_ontology_term_id"
          description: "Ontology term identifier for the organism, providing a standardized\
            \ reference for the organism.\n\nMust be a term from the NCBI Taxonomy\
            \ Ontology (`NCBITaxon:`) which is a child of `NCBITaxon:33208`.\n"
          required: true
        - type: "string"
          name: "self_reported_ethnicity"
          description: "Ethnicity of the donor as self-reported, relevant for studies\
            \ considering genetic diversity and population-specific traits."
          required: false
        - type: "string"
          name: "self_reported_ethnicity_ontology_term_id"
          description: "Ontology term identifier for the self-reported ethnicity,\
            \ providing a standardized reference for ethnic classifications.\n\nIf\
            \ the organism is human (`organism_ontology_term_id == 'NCBITaxon:9606'`),\
            \ then the Human Ancestry Ontology (`HANCESTRO:`) is used.\n"
          required: true
        - type: "string"
          name: "sex"
          description: "Biological sex of the donor or source organism, crucial for\
            \ studies involving sex-specific traits or conditions."
          required: false
        - type: "string"
          name: "sex_ontology_term_id"
          description: "Ontology term identifier for the biological sex, ensuring\
            \ standardized classification of sex. Only `PATO:0000383`, `PATO:0000384`\
            \ and `PATO:0001340` are allowed."
          required: true
        - type: "string"
          name: "suspension_type"
          description: "Type of suspension or medium in which the cells were stored\
            \ or processed, important for understanding cell handling and conditions."
          required: false
        - type: "string"
          name: "tissue"
          description: "Specific tissue from which the cells were derived, key for\
            \ context and specificity in cell studies."
          required: false
        - type: "string"
          name: "tissue_ontology_term_id"
          description: "Ontology term identifier for the tissue, providing a standardized\
            \ reference for the tissue type.\n\nFor organoid or tissue samples, the\
            \ Uber-anatomy ontology (`UBERON:`) is used. The term ids must be a child\
            \ term of `UBERON:0001062` (anatomical entity).\nFor cell cultures, the\
            \ Cell Ontology (`CL:`) is used. The term ids cannot be `CL:0000255`,\
            \ `CL:0000257` or `CL:0000548`.\n"
          required: true
        - type: "string"
          name: "tissue_general"
          description: "General category or classification of the tissue, useful for\
            \ broader grouping and comparison of cell data."
          required: false
        - type: "string"
          name: "tissue_general_ontology_term_id"
          description: "Ontology term identifier for the general tissue category,\
            \ aiding in standardizing and grouping tissue types.\n\nFor organoid or\
            \ tissue samples, the Uber-anatomy ontology (`UBERON:`) is used. The term\
            \ ids must be a child term of `UBERON:0001062` (anatomical entity).\n\
            For cell cultures, the Cell Ontology (`CL:`) is used. The term ids cannot\
            \ be `CL:0000255`, `CL:0000257` or `CL:0000548`.\n"
          required: false
        - type: "string"
          name: "batch"
          description: "A batch identifier. This label is very context-dependent and\
            \ may be a combination of the tissue, assay, donor, etc."
          required: false
        - type: "integer"
          name: "soma_joinid"
          description: "If the dataset was retrieved from CELLxGENE census, this is\
            \ a unique identifier for the cell."
          required: false
        var:
        - type: "string"
          name: "feature_id"
          description: "Unique identifier for the feature, usually a ENSEMBL gene\
            \ id."
          required: false
        - type: "string"
          name: "feature_name"
          description: "A human-readable name for the feature, usually a gene symbol."
          required: true
        - type: "integer"
          name: "soma_joinid"
          description: "If the dataset was retrieved from CELLxGENE census, this is\
            \ a unique identifier for the feature."
          required: false
        uns:
        - type: "string"
          name: "dataset_id"
          description: "A unique identifier for the dataset. This is different from\
            \ the `obs.dataset_id` field, which is the identifier for the dataset\
            \ from which the cell data is derived."
          required: true
        - name: "dataset_name"
          type: "string"
          description: "A human-readable name for the dataset."
          required: true
        - type: "string"
          name: "dataset_url"
          description: "Link to the original source of the dataset."
          required: false
        - name: "dataset_reference"
          type: "string"
          description: "Bibtex reference of the paper in which the dataset was published."
          required: false
          multiple: true
        - name: "dataset_summary"
          type: "string"
          description: "Short description of the dataset."
          required: true
        - name: "dataset_description"
          type: "string"
          description: "Long description of the dataset."
          required: true
        - name: "dataset_technology"
          type: "string"
          description: "The technology used to generate the dataset."
          required: false
        - name: "dataset_organ"
          type: "string"
          description: "The organ of the sample in the dataset."
          required: false
        - name: "dataset_tissue"
          type: "string"
          description: "The tissue of the sample in the dataset."
          required: false
    example:
    - "resources_test/common/cxg_mouse_pancreas_atlas/raw.anndata.zarr"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
resources:
- type: "nextflow_script"
  path: "main.nf"
  is_executable: true
  entrypoint: "run_wf"
description: "Fetch a dataset from the CELLxGENE Census and store it as a raw dataset.\n"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
dependencies:
- name: "loaders/scrnaseq/cellxgene_census"
  repository:
    type: "local"
- name: "processors/subsample"
  repository:
    type: "local"
- name: "validation/validate_dataset"
  repository:
    type: "local"
repositories:
- type: "github"
  name: "openproblems"
  repo: "openproblems-bio/openproblems"
  tag: "build/main"
license: "MIT"
links:
  repository: "https://github.com/openproblems-bio/datasets"
  docker_registry: "ghcr.io"
runners:
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      lowmem: "memory = 20.Gb"
      midmem: "memory = 50.Gb"
      highmem: "memory = 100.Gb"
      lowcpu: "cpus = 5"
      midcpu: "cpus = 15"
      highcpu: "cpus = 30"
      lowtime: "time = 1.h"
      midtime: "time = 4.h"
      hightime: "time = 8.h"
      veryhightime: "time = 24.h"
  debug: false
  container: "docker"
build_info:
  config: "src/workflows/scrnaseq/load_cellxgene_census/config.vsh.yaml"
  runner: "nextflow"
  engine: "native"
  output: "target/nextflow/workflows/scrnaseq/load_cellxgene_census"
  executable: "target/nextflow/workflows/scrnaseq/load_cellxgene_census/main.nf"
  viash_version: "0.9.7"
  git_commit: "bd768912999396dd71cc1071b5a1b64e24f4d235"
  git_remote: "https://github.com/openproblems-bio/datasets"
  dependencies:
  - "target/nextflow/loaders/scrnaseq/cellxgene_census"
  - "target/nextflow/processors/subsample"
  - "target/nextflow/validation/validate_dataset"
package_config:
  name: "datasets"
  version: "build_main"
  description: "Datasets for benchmarking open problems in single-cell analysis.\n"
  info:
    test_resources:
    - path: "lamin://openproblems/data-dev/collection/Ajn1Lo8zZomVzKtQ0005"
      dest: "resources_test/common/cxg_mouse_pancreas_atlas"
      strip_prefix: "resources_test/datasets/cxg_mouse_pancreas_atlas/"
  repositories:
  - type: "github"
    name: "openproblems"
    repo: "openproblems-bio/openproblems"
    tag: "build/main"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".runners[.type == \"nextflow\"].config.labels := { lowmem : \"memory = 20.Gb\"\
    , midmem : \"memory = 50.Gb\", highmem : \"memory = 100.Gb\", lowcpu : \"cpus\
    \ = 5\", midcpu : \"cpus = 15\", highcpu : \"cpus = 30\", lowtime : \"time = 1.h\"\
    , midtime : \"time = 4.h\", hightime : \"time = 8.h\", veryhightime : \"time =\
    \ 24.h\" }\n.engines[.type == \"docker\"].setup += { type: \"docker\", env: [\"\
    ANNDATA_AUTO_SHARD_ZARR_V3=1\", \"OMP_NUM_THREADS=4\", \"OPENBLAS_NUM_THREADS=4\"\
    , \"MKL_NUM_THREADS=4\", \"NUMBA_NUM_THREADS=4\"] }\n"
  keywords:
  - "openproblems"
  - "benchmarking"
  - "single-cell omics"
  license: "MIT"
  organization: "openproblems-bio"
  references:
    doi:
    - "10.1038/s41587-025-02694-w"
  links:
    repository: "https://github.com/openproblems-bio/datasets"
    docker_registry: "ghcr.io"
    issue_tracker: "https://github.com/openproblems-bio/datasets/issues"
