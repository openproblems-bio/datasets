name: openproblems_neurips2022_pbmc
namespace: loaders/multimodal
description: Fetch a dataset from the OpenProblems NeurIPS2022 competition
argument_groups:
  - name: Inputs
    arguments:
      - name: --input_mod1
        type: file
        description: Processed RNA h5ad file
        required: true
        example: cite_rna_merged.h5ad
      - name: --input_mod2
        type: file
        description: Processed ADT or ATAC h5ad file
        required: true
        example: cite_prot_merged.h5ad
      - name: --mod1
        type: string
        description: Name of the first modality.
        required: true
        example: GEX
      - name: --mod2
        type: string
        description: Name of the second modality.
        required: true
        example: ADT
  - name: Metadata
    arguments:
      - name: --dataset_id
        type: string
        description: A unique identifier for the dataset
        required: true
      - name: --dataset_name
        type: string
        description: Nicely formatted name.
        required: true
      - name: --dataset_url
        type: string
        description: Link to the original source of the dataset.
        required: false
      - name: --dataset_reference
        type: string
        multiple: true
        description: Bibtex reference of the paper in which the dataset was published.
        required: false
      - name: --dataset_summary
        type: string
        description: Short description of the dataset.
        required: true
      - name: --dataset_description
        type: string
        description: Long description of the dataset.
        required: true
  - name: Outputs
    arguments:
      - name: --output
        __merge__: /src/api/file_multimodal_raw.yaml
        direction: output
        required: true
resources:
  - type: python_script
    path: script.py
  - path: /src/utils/mudata_utils.py
test_resources:
  - type: python_script
    path: test.py
engines:
  - type: docker
    image: openproblems/base_python:1
    setup:
      - type: python
        packages: ["mudata~=0.4"]
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [highmem, midcpu, midtime]
