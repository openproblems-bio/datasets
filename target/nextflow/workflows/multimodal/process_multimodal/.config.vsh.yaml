resources:
- type: "nextflow_script"
  path: "main.nf"
  is_executable: true
  entrypoint: "run_wf"
description: "Process a raw multimodal dataset into a common multimodal dataset. Each\
  \ modality is\nnormalised in the way that suits it (gene expression to log CP10k,\
  \ surface proteins with\nCLR, chromatin accessibility with TF-IDF), gets a truncated\
  \ SVD embedding and a selection\nof highly variable features.\n"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
dependencies:
- name: "utils/split_mudata"
  repository:
    type: "local"
- name: "utils/combine_mudata"
  repository:
    type: "local"
- name: "normalization/log_cp"
  repository:
    type: "local"
- name: "normalization/prot_clr"
  repository:
    type: "local"
- name: "normalization/atac_tfidf"
  repository:
    type: "local"
- name: "processors/svd"
  repository:
    type: "local"
- name: "processors/hvg"
  repository:
    type: "local"
- name: "validation/validate_dataset"
  repository:
    type: "local"
repositories:
- type: "github"
  name: "openproblems"
  repo: "openproblems-bio/openproblems"
  tag: "build/main"
license: "MIT"
links:
  repository: "https://github.com/openproblems-bio/datasets"
  docker_registry: "ghcr.io"
runners:
- type: "nextflow"
  id: "nextflow"
  directives:
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      lowmem: "memory = 20.Gb"
      midmem: "memory = 50.Gb"
      highmem: "memory = 100.Gb"
      lowcpu: "cpus = 5"
      midcpu: "cpus = 15"
      highcpu: "cpus = 30"
      lowtime: "time = 1.h"
      midtime: "time = 4.h"
      hightime: "time = 8.h"
      veryhightime: "time = 24.h"
  debug: false
  container: "docker"
build_info:
  config: "src/workflows/multimodal/process_multimodal/config.vsh.yaml"
  runner: "nextflow"
  engine: "native"
  output: "target/nextflow/workflows/multimodal/process_multimodal"
  executable: "target/nextflow/workflows/multimodal/process_multimodal/main.nf"
  viash_version: "0.9.7"
  git_commit: "11842fab8e01ff50c6a4491a0625b31fccae4bcf"
  git_remote: "https://github.com/openproblems-bio/datasets"
  dependencies:
  - "target/nextflow/utils/split_mudata"
  - "target/nextflow/utils/combine_mudata"
  - "target/nextflow/normalization/log_cp"
  - "target/nextflow/normalization/prot_clr"
  - "target/nextflow/normalization/atac_tfidf"
  - "target/nextflow/processors/svd"
  - "target/nextflow/processors/hvg"
  - "target/nextflow/validation/validate_dataset"
package_config:
  name: "datasets"
  version: "build_main"
  description: "Datasets for benchmarking open problems in single-cell analysis.\n"
  info:
    test_resources:
