name: datasets
organization: openproblems-bio
viash_version: 0.9.7

description: |
  Datasets for benchmarking open problems in single-cell analysis.
license: MIT
keywords: [openproblems, benchmarking, single-cell omics]

references:
  doi:
    # Luecken, M.D., Gigante, S., Burkhardt, D.B. et al.
    # Defining and benchmarking open problems in single-cell analysis.
    # Nat Biotechnol 43, 1035–1040 (2025).
    - 10.1038/s41587-025-02694-w

links:
  issue_tracker: https://github.com/openproblems-bio/datasets/issues
  repository: https://github.com/openproblems-bio/datasets
  docker_registry: ghcr.io

config_mods: |
  .runners[.type == "nextflow"].config.labels := { lowmem : "memory = 20.Gb", midmem : "memory = 50.Gb", highmem : "memory = 100.Gb", lowcpu : "cpus = 5", midcpu : "cpus = 15", highcpu : "cpus = 30", lowtime : "time = 1.h", midtime : "time = 4.h", hightime : "time = 8.h", veryhightime : "time = 24.h" }
  .engines[.type == "docker"].setup += { type: "docker", env: ["ANNDATA_ZARR_WRITE_FORMAT=3"] }

repositories:
  - name: openproblems
    type: github
    repo: openproblems-bio/openproblems
    tag: build/main

info:
  test_resources:
    # created by scripts/create_test_resources/cxg_mouse_pancreas_atlas.ipynb
    - path: lamin://openproblems/data-dev/collection/Ajn1Lo8zZomVzKtQ0001
      dest: resources_test/common/cxg_mouse_pancreas_atlas
      strip_prefix: resources_test/datasets/cxg_mouse_pancreas_atlas/
